<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- =========================================================
         MAPA DO HEAD
         Aqui ficam as configurações principais da página:
         - charset: permite acentos e caracteres especiais;
         - viewport: deixa a tela responsiva no celular;
         - title/description: ajudam na identificação da página;
         - favicon: ícone da aba do navegador;
         - CSS: estilos visuais da tela.
    ========================================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Painel SENTRYX</title>

    <!-- =========================================================
         SEO BÁSICO DA PÁGINA
         Descrição usada para identificar a página de cadastro.
    ========================================================== -->
    <meta name="description"
        content="Crie sua conta no painel da SENTRYX para acompanhar sensores, alertas e contatos de emergência.">

    <meta name="theme-color" content="#070E1E">

    <!-- =========================================================
         FAVICON
         Ícone exibido na aba do navegador.
    ========================================================== -->
    <link rel="shortcut icon" href="assets/favicon16x16.png" type="image/x-icon">

    <!-- =========================================================
         CSS DA PÁGINA
         login.css:
         Reaproveitamos o mesmo CSS da tela de login para manter
         identidade visual e padrão entre login e cadastro.

         Font Awesome:
         Biblioteca de ícones, caso seja usada no layout.

         responsive-mobile-fixes.css:
         Correções finais para responsividade em telas menores.
    ========================================================== -->
    <link rel="stylesheet" href="css/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="stylesheet" href="css/responsive-mobile-fixes.css">
</head>

<body>

    <!-- =========================================================
         PÁGINA DE CADASTRO
         Esta tela permite criar uma conta para acessar o painel
         da SENTRYX.

         IMPORTANTE:
         Esta página agora está integrada ao Flask + MySQL.

         O usuário preenche os dados:
         - nome
         - email
         - senha
         - telefone

         Depois o formulário envia essas informações para a rota
         /cadastro no app.py.

         O Flask recebe os dados, criptografa a senha e salva tudo
         na tabela usuarios do banco sentryx_db.
    ========================================================== -->

    <div class="container">
        <div class="login-box">

            <!-- =================================================
                 MARCA DA TELA
                 Exibe o nome SENTRYX com o X destacado pelo CSS.
            ================================================== -->
            <h1>SENTRY<span>X</span></h1>
            <p>Crie sua conta para acessar o painel</p>

            <!-- =================================================
                 FORMULÁRIO DE CADASTRO CONECTADO AO FLASK

                 action="/cadastro":
                 Envia os dados para a rota /cadastro do Flask.

                 method="POST":
                 Envia os dados internamente para o backend.

                 No app.py, esses dados são recebidos assim:

                 nome = request.form.get('nome')
                 email = request.form.get('email')
                 senha = request.form.get('senha')
                 telefone = request.form.get('telefone')

                 Depois o Flask salva essas informações no MySQL.
            ================================================== -->
            <form action="/cadastro" method="POST">

                <!-- =============================================
                     CAMPO DE NOME

                     name="nome":
                     Esse nome precisa bater com o que está no app.py.
                     Ele será salvo na coluna nome da tabela usuarios.
                ============================================== -->
                <div class="input-box">
                    <input type="text" name="nome" placeholder="Nome completo" required>
                </div>

                <!-- =============================================
                     CAMPO DE EMAIL

                     name="email":
                     O Flask usa esse valor para cadastrar o email
                     do usuário no banco.

                     No banco, o email está como UNIQUE, ou seja,
                     não permite dois usuários com o mesmo email.
                ============================================== -->
                <div class="input-box">
                    <input type="email" name="email" placeholder="Email" required>
                </div>

                <!-- =============================================
                     CAMPO DE SENHA

                     name="senha":
                     A senha digitada será enviada ao Flask.

                     IMPORTANTE:
                     A senha não é salva pura no banco.
                     No app.py, usamos generate_password_hash()
                     para salvar uma senha criptografada.
                ============================================== -->
                <div class="input-box">
                    <input type="password" name="senha" placeholder="Senha" required>
                </div>

                <!-- =============================================
                     CAMPO DE TELEFONE

                     name="telefone":
                     Campo opcional para contato do usuário.
                     Será salvo na coluna telefone da tabela usuarios.
                ============================================== -->
                <div class="input-box">
                    <input type="text" name="telefone" placeholder="Telefone">
                </div>

                <!-- =============================================
                     BOTÃO DE CADASTRAR

                     type="submit":
                     Envia o formulário para o backend Flask.

                     Quando o cadastro dá certo, o Flask redireciona
                     o usuário para a tela de login.
                ============================================== -->
                <button class="botao-login" type="submit">Cadastrar</button>
            </form>

            <!-- =================================================
                 LINK PARA LOGIN

                 Se o usuário já tiver conta, ele pode voltar para
                 a rota /login.

                 Esse link não abre mais diretamente indexlogin.html.
                 Agora ele passa pelo Flask.
            ================================================== -->
            <div class="extra">
                <p>Já tem conta? <a href="/login">Entrar</a></p>
            </div>

            <!-- =================================================
                 MENSAGENS DO FLASK

                 Aqui aparecem mensagens enviadas pelo app.py com flash().

                 Exemplos:
                 - "Cadastro realizado com sucesso! Agora faça login."
                 - "Este e-mail já está cadastrado."
                 - "Erro ao cadastrar..."

                 Essa parte só funciona quando a página é aberta pelo Flask:
                 http://127.0.0.1:5000/cadastro
            ================================================== -->
            {% with mensagens = get_flashed_messages() %}
                {% if mensagens %}
                    <div class="mensagens">
                        {% for mensagem in mensagens %}
                            <p>{{ mensagem }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

        </div>
    </div>

    <!-- =========================================================
         ACESSIBILIDADE - VLIBRAS
         Plugin oficial de acessibilidade em Libras.
         Mantido para tornar o projeto mais inclusivo.
    ========================================================== -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>

        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

</body>

</html>
